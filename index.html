<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D2D Examination Portal | CBT Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- KaTeX for Beautiful Textbook Math Equations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .katex { font-size: 1.05em; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // ⚙️ AUTH & INFRASTRUCTURE KEYS (EMAILJS & SUPABASE)
    // =========================================================================
    const ADMIN_EMAIL = 'fizavaraiya@gmail.com'.toLowerCase();
    const EMAILJS_PUBLIC_KEY  = 'ia2zoR2_x3PWxqT2Q';     
    const EMAILJS_SERVICE_ID  = 'service_xo69pzg';     
    const EMAILJS_TEMPLATE_ID = 'template_5totzc2';      
    const SUPABASE_URL = 'https://padfkukxtxvzaesvlgjx.supabase.co';     
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhZGZrdWt4dHh2emFlc3ZsZ2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NzQ4MzUsImV4cCI6MjEwNDM1MDgzNX0._LOh3gQV5MjikHDsZ2kLfFXpNASJZWIRn5w24OkTiQI';    
   // =========================================================================

    const cleanUrl = SUPABASE_URL.trim().replace(/\/+$/, '');
    const supabase = (cleanUrl.startsWith('http')) 
      ? window.supabase.createClient(cleanUrl, SUPABASE_ANON_KEY.trim()) 
      : null;

    // LaTeX Math Renderer Component
    function MathRenderer({ text }) {
      const elRef = useRef(null);

      useEffect(() => {
        if (elRef.current && window.renderMathInElement) {
          window.renderMathInElement(elRef.current, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false },
              { left: '\\[', right: '\\]', display: true }
            ],
            throwOnError: false
          });
        }
      }, [text]);

      return <span ref={elRef}>{text}</span>;
    }

    function App() {
      const savedUser = JSON.parse(localStorage.getItem('d2d_portal_user') || 'null');

      const [currentUser, setCurrentUser] = useState(savedUser);
      const [view, setView] = useState(savedUser ? 'portal' : 'auth');
      const [activeTab, setActiveTab] = useState(savedUser?.isAdmin ? 'admin' : 'dashboard'); 
      const [authMode, setAuthMode] = useState('login'); 
      const [step, setStep] = useState('input');
      
      const [fullName, setFullName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      const [otp, setOtp] = useState(['', '', '', '', '', '']);
      const [generatedOtp, setGeneratedOtp] = useState('');
      const [timer, setTimer] = useState(30);
      const [canResend, setCanResend] = useState(false);
      const [authMsg, setAuthMsg] = useState('');
      const [loading, setLoading] = useState(false);

      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      
      // CBT Exam State tracking
      const [userAnswers, setUserAnswers] = useState({});
      const [reviewedQuestions, setReviewedQuestions] = useState({});
      const [visitedQuestions, setVisitedQuestions] = useState({ 0: true });

      const [studentScores, setStudentScores] = useState([]);
      const [leaderboardData, setLeaderboardData] = useState([]);
      const [adminMsg, setAdminMsg] = useState('');
      const [examTimeLeft, setExamTimeLeft] = useState(0);
      const [lastExamSummary, setLastExamSummary] = useState(null);

      const inputRefs = useRef([]);
      const userAnswersRef = useRef(userAnswers);
      userAnswersRef.current = userAnswers;

      // Anti-Refresh & Exit Protection Shield during Exam
      useEffect(() => {
        const handleBeforeUnload = (e) => {
          if (view === 'quiz') {
            e.preventDefault();
            e.returnValue = '';
          }
        };
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [view]);

      // Auto-load records upon startup
      useEffect(() => {
        if (currentUser) {
          loadStudentHistory(currentUser.email);
          loadLeaderboard();
          fetchQuestionsFromDB().then(loaded => setQuestions(loaded));
        }
      }, []);

      useEffect(() => {
        let interval = null;
        if (step === 'otp' && timer > 0) {
          interval = setInterval(() => setTimer(t => t - 1), 1000);
        } else if (timer === 0) {
          setCanResend(true);
        }
        return () => clearInterval(interval);
      }, [step, timer]);

      useEffect(() => {
        let interval = null;
        if (view === 'quiz' && examTimeLeft > 0) {
          interval = setInterval(() => {
            setExamTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(interval);
                handleFinishTest(true);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [view, examTimeLeft]);

      const formatTime = (totalSec) => {
        const hrs = Math.floor(totalSec / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        const pad = (n) => String(n).padStart(2, '0');
        return hrs > 0 ? `${pad(hrs)}:${pad(mins)}:${pad(secs)}` : `${pad(mins)}:${pad(secs)}`;
      };

      const fetchQuestionsFromDB = async () => {
        if (!supabase) return [];
        const { data, error } = await supabase.from('active_quiz').select('*').order('id', { ascending: true });
        if (error || !data) return [];
        return data.map((row, idx) => ({
          id: idx + 1,
          question: row.question,
          options: { A: row.option_a, B: row.option_b, C: row.option_c, D: row.option_d },
          answer: row.answer
        }));
      };

      const loadStudentHistory = async (studentEmail) => {
        if (!supabase) return;
        const { data, error } = await supabase
          .from('student_scores')
          .select('*')
          .eq('student_email', studentEmail)
          .order('attempted_at', { ascending: false });

        if (!error && data) setStudentScores(data);
      };

      const loadLeaderboard = async () => {
        if (!supabase) return;
        const { data, error } = await supabase
          .from('leaderboard')
          .select('*')
          .order('rank', { ascending: true })
          .limit(50);

        if (!error && data) setLeaderboardData(data);
      };

      const handlePasswordLogin = async (e) => {
        e.preventDefault();
        setAuthMsg('');

        const cleanEmail = email.trim().toLowerCase();
        if (!cleanEmail || !loginPassword) {
          setAuthMsg('Please provide both email and password.');
          return;
        }

        setLoading(true);
        try {
          const { data: user, error } = await supabase
            .from('students')
            .select('*')
            .eq('email', cleanEmail)
            .maybeSingle();

          if (error || !user) {
            setAuthMsg('No account found with this email. Please register first.');
            setLoading(false);
            return;
          }

          if (user.password !== loginPassword) {
            setAuthMsg('Incorrect password. Please try again.');
            setLoading(false);
            return;
          }

          loginSuccess(user.full_name, cleanEmail);
        } catch (err) {
          setAuthMsg('Login connection failed.');
        } finally {
          setLoading(false);
        }
      };

      // EmailJS Delivery Handler
      const handleSendOtp = async (e) => {
        e?.preventDefault();
        setAuthMsg('');

        if (authMode === 'register' && !fullName.trim()) {
          setAuthMsg('Please enter your full name');
          return;
        }
        if (!email.trim() || !email.includes('@')) {
          setAuthMsg('Please enter a valid Gmail address');
          return;
        }

        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedOtp(code);
        setLoading(true);

        try {
          emailjs.init(EMAILJS_PUBLIC_KEY.trim());
          await emailjs.send(EMAILJS_SERVICE_ID.trim(), EMAILJS_TEMPLATE_ID.trim(), {
            to_email: email.trim(),
            recipient_email: email.trim(),
            otp_code: code,
            otp: code,
          });

          setStep('otp');
          setTimer(30);
          setCanResend(false);
          setOtp(['', '', '', '', '', '']);
          setTimeout(() => inputRefs.current[0]?.focus(), 150);
        } catch (err) {
          setAuthMsg('Failed to send email. Verify EmailJS keys.');
        } finally {
          setLoading(false);
        }
      };

      const handleVerifyOtp = (e) => {
        e.preventDefault();
        if (otp.join('') !== generatedOtp) {
          setAuthMsg('Invalid OTP code. Try again.');
          return;
        }
        setAuthMsg('');
        setStep('set_password');
      };

      const handleSetPassword = async (e) => {
        e.preventDefault();
        setAuthMsg('');

        if (password.length < 6) {
          setAuthMsg('Password must be at least 6 characters long.');
          return;
        }
        if (password !== confirmPassword) {
          setAuthMsg('Passwords do not match.');
          return;
        }

        const cleanEmail = email.trim().toLowerCase();
        const studentName = fullName.trim() || cleanEmail.split('@')[0];

        setLoading(true);
        try {
          const { error } = await supabase.from('students').upsert([{
            email: cleanEmail,
            full_name: studentName,
            password: password
          }]);

          if (error) {
            setAuthMsg('Failed to save account: ' + error.message);
            setLoading(false);
            return;
          }

          loginSuccess(studentName, cleanEmail);
        } catch (err) {
          setAuthMsg('Failed to establish profile.');
        } finally {
          setLoading(false);
        }
      };

      const loginSuccess = async (name, studentEmail) => {
        const loggedInUser = {
          name: name,
          email: studentEmail,
          isAdmin: studentEmail === ADMIN_EMAIL
        };

        localStorage.setItem('d2d_portal_user', JSON.stringify(loggedInUser));

        setCurrentUser(loggedInUser);
        await loadStudentHistory(studentEmail);
        await loadLeaderboard();

        const loadedQ = await fetchQuestionsFromDB();
        setQuestions(loadedQ);

        setView('portal');
        setActiveTab(loggedInUser.isAdmin ? 'admin' : 'dashboard');
      };

      // Resilient Dual-Mode Parser (Header + Positional Fallback)
      const processQuestionText = async (rawContent) => {
        setAdminMsg('Analyzing and uploading questions...');

        let cleanContent = String(rawContent || '')
          .replace(/^\uFEFF/, '')
          .trim();

        if (cleanContent.startsWith('```')) {
          cleanContent = cleanContent.replace(/^```[a-zA-Z]*\n?/, '').replace(/```$/, '').trim();
        }

        const parsedFirstPass = Papa.parse(cleanContent, {
          skipEmptyLines: 'greedy'
        });

        const rawRows = parsedFirstPass.data || [];
        if (rawRows.length === 0) {
          setAdminMsg('Error: Provided input is empty.');
          return;
        }

        let rowsToInsert = [];
        let parsedList = [];

        // Check if Row 0 contains headers
        const firstRowText = rawRows[0].join(' ').toLowerCase();
        const hasHeader = firstRowText.includes('question') || firstRowText.includes('option');
        const dataRows = hasHeader ? rawRows.slice(1) : rawRows;

        dataRows.forEach((cols) => {
          if (!Array.isArray(cols) || cols.length < 5) return;

          const q = cols[0] ? String(cols[0]).trim() : '';
          const a = cols[1] ? String(cols[1]).trim() : '';
          const b = cols[2] ? String(cols[2]).trim() : '';
          const c = cols[3] ? String(cols[3]).trim() : '';
          const d = cols[4] ? String(cols[4]).trim() : '';
          let ans = cols[5] ? String(cols[5]).trim() : 'A';

          ans = ans.toUpperCase().replace(/[^A-D]/g, '').charAt(0) || 'A';

          if (q && a && b) {
            const qItem = {
              id: parsedList.length + 1,
              question: q,
              options: { A: a, B: b, C: c || 'None of these', D: d || 'All of these' },
              answer: ans
            };
            parsedList.push(qItem);
            rowsToInsert.push({
              question: q,
              option_a: a,
              option_b: b,
              option_c: c || 'None of these',
              option_d: d || 'All of these',
              answer: ans
            });
          }
        });

        if (rowsToInsert.length === 0) {
          setAdminMsg('Error: Could not extract questions. Please check that options are separated by commas.');
          return;
        }

        if (supabase) {
          await supabase.from('active_quiz').delete().neq('id', 0);
          const { error } = await supabase.from('active_quiz').insert(rowsToInsert);
          if (error) {
            setAdminMsg('Database upload error: ' + error.message);
            return;
          }
        }

        setQuestions(parsedList);
        setAdminMsg(`Success! Published ${parsedList.length} questions for ALL students.`);
      };

      const handleAdminCSVUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setAdminMsg('');
        const reader = new FileReader();
        reader.onload = (event) => processQuestionText(event.target.result);
        reader.readAsText(file);
      };

      // CBT Engine Navigation
      const startExam = () => {
        if (questions.length === 0) {
          alert("No questions uploaded yet. Upload via Admin Panel.");
          return;
        }
        setUserAnswers({});
        setReviewedQuestions({});
        setVisitedQuestions({ 0: true });
        setCurrentIndex(0);
        const totalMinutes = questions.length * 1.5;
        setExamTimeLeft(Math.round(totalMinutes * 60));
        setView('quiz');
      };

      const goToQuestion = (idx) => {
        setVisitedQuestions(prev => ({ ...prev, [idx]: true }));
        setCurrentIndex(idx);
      };

      const handleSaveAndNext = () => {
        const nextIdx = Math.min(questions.length - 1, currentIndex + 1);
        goToQuestion(nextIdx);
      };

      const handleMarkForReviewAndNext = () => {
        setReviewedQuestions(prev => ({ ...prev, [currentIndex]: !prev[currentIndex] }));
        const nextIdx = Math.min(questions.length - 1, currentIndex + 1);
        goToQuestion(nextIdx);
      };

      const handleClearResponse = () => {
        const updated = { ...userAnswers };
        delete updated[currentIndex];
        setUserAnswers(updated);
      };

      const handleFinishTest = async (isAutoSubmit = false) => {
        const answers = isAutoSubmit ? userAnswersRef.current : userAnswers;
        let correctCount = 0;
        let wrongCount = 0;
        let unattemptedCount = 0;

        questions.forEach((q, idx) => {
          if (!answers[idx]) {
            unattemptedCount++;
          } else if (answers[idx] === q.answer) {
            correctCount++;
          } else {
            wrongCount++;
          }
        });

        const finalScore = correctCount;
        const percentage = Number(((finalScore / questions.length) * 100).toFixed(1));

        setLastExamSummary({
          correct: correctCount,
          wrong: wrongCount,
          unattempted: unattemptedCount,
          score: finalScore,
          total: questions.length,
          percentage: percentage
        });

        if (supabase && currentUser) {
          try {
            await supabase.from('student_scores').insert([{
              student_email: currentUser.email,
              score: finalScore,
              total_questions: questions.length,
              percentage: percentage
            }]);
            await loadStudentHistory(currentUser.email);
            await loadLeaderboard();
          } catch (err) {
            console.error(err);
          }
        }

        if (isAutoSubmit) {
          alert("Time's up! Exam submitted automatically.");
        }

        setView('result');
      };

      // Palette Status Calculator
      const getQuestionStatus = (idx) => {
        const isAnswered = !!userAnswers[idx];
        const isReviewed = !!reviewedQuestions[idx];
        const isVisited = !!visitedQuestions[idx];

        if (isReviewed) return 'reviewed';
        if (isAnswered) return 'answered';
        if (isVisited) return 'visited';
        return 'not_visited';
      };

      const countAnswered = Object.keys(userAnswers).length;
      const countReviewed = Object.keys(reviewedQuestions).filter(k => reviewedQuestions[k]).length;
      const countUnanswered = questions.length - countAnswered;

      const bestPercentage = studentScores.length > 0 
        ? Math.max(...studentScores.map(s => Number(s.percentage)))
        : 0;

      return (
        <div className="min-h-screen flex flex-col">

          {/* AUTH VIEW */}
          {view === 'auth' && (
            <div className="flex-1 flex items-center justify-center p-4 bg-slate-100">
              <div className="max-w-md w-full bg-white border border-slate-200 rounded-3xl p-8 shadow-xl shadow-slate-200/50">
                <div className="text-center mb-6">
                  <div className="inline-flex items-center gap-2.5 mb-2">
                    <span className="w-9 h-9 rounded-xl bg-indigo-600 text-white font-extrabold flex items-center justify-center text-lg shadow-md shadow-indigo-500/20">D</span>
                    <span className="text-xl font-extrabold tracking-tight text-slate-900">D2D Portal</span>
                  </div>
                  <h2 className="text-sm font-semibold text-slate-500">Entrance Examination Management System</h2>
                </div>

                {step === 'input' && (
                  <div className="flex bg-slate-100 p-1 rounded-xl mb-5">
                    <button
                      onClick={() => { setAuthMode('login'); setAuthMsg(''); }}
                      className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${authMode === 'login' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`}
                    >
                      Sign In
                    </button>
                    <button
                      onClick={() => { setAuthMode('register'); setAuthMsg(''); }}
                      className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${authMode === 'register' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`}
                    >
                      Register with OTP
                    </button>
                  </div>
                )}

                {authMsg && (
                  <div className="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-medium">
                    {authMsg}
                  </div>
                )}

                {step === 'input' && authMode === 'login' && (
                  <form onSubmit={handlePasswordLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs uppercase font-bold text-slate-500 mb-1">Gmail Address</label>
                      <input
                        type="email"
                        required
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        placeholder="candidate@gmail.com"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="block text-xs uppercase font-bold text-slate-500">Password</label>
                        <button
                          type="button"
                          onClick={() => { setAuthMode('register'); handleSendOtp(); }}
                          className="text-[11px] text-indigo-600 hover:underline font-semibold"
                        >
                          Forgot Password?
                        </button>
                      </div>
                      <input
                        type="password"
                        required
                        value={loginPassword}
                        onChange={(e) => setLoginPassword(e.target.value)}
                        placeholder="Enter password"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={loading}
                      className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-semibold text-white rounded-xl text-sm transition shadow-lg shadow-indigo-600/25"
                    >
                      {loading ? 'Authenticating...' : 'Sign In'}
                    </button>
                  </form>
                )}

                {step === 'input' && authMode === 'register' && (
                  <form onSubmit={handleSendOtp} className="space-y-4">
                    <div>
                      <label className="block text-xs uppercase font-bold text-slate-500 mb-1">Candidate Full Name</label>
                      <input
                        type="text"
                        required
                        value={fullName}
                        onChange={(e) => setFullName(e.target.value)}
                        placeholder="e.g. Naved Varaiya"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs uppercase font-bold text-slate-500 mb-1">Gmail Address</label>
                      <input
                        type="email"
                        required
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        placeholder="candidate@gmail.com"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={loading}
                      className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-semibold text-white rounded-xl text-sm transition shadow-lg shadow-indigo-600/25"
                    >
                      {loading ? 'Dispatching OTP...' : 'Send Verification OTP'}
                    </button>
                  </form>
                )}

                {step === 'otp' && (
                  <div>
                    <p className="text-xs text-center text-slate-500 mb-4">Enter the 6-digit code dispatched to <b>{email}</b></p>
                    
                    <div className="flex justify-between gap-2 mb-6">
                      {otp.map((digit, i) => (
                        <input
                          key={i}
                          ref={(el) => (inputRefs.current[i] = el)}
                          type="text"
                          maxLength={1}
                          value={digit}
                          onChange={(e) => {
                            const val = e.target.value.slice(-1);
                            const nextOtp = [...otp];
                            nextOtp[i] = val;
                            setOtp(nextOtp);
                            if (val && i < 5) inputRefs.current[i + 1]?.focus();
                          }}
                          onKeyDown={(e) => {
                            if (e.key === 'Backspace' && !otp[i] && i > 0) inputRefs.current[i - 1]?.focus();
                          }}
                          className="w-11 h-12 text-center text-xl font-bold bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                      ))}
                    </div>

                    <button
                      onClick={handleVerifyOtp}
                      className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-semibold text-white rounded-xl text-sm transition shadow-lg shadow-indigo-600/25"
                    >
                      Verify Code →
                    </button>

                    <div className="text-center mt-4 text-xs text-slate-400">
                      {canResend ? (
                        <button onClick={handleSendOtp} className="text-indigo-600 font-bold hover:underline">

                        required
                        minLength={6}

                        onChange={(e) => setPassword(e.target.value)}
                        placeholder="At least 6 characters"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs uppercase font-bold text-slate-500 mb-1">Confirm Password</label>
                      <input
                        type="password"
                        required
                        minLength={6}
                        value={confirmPassword}
                        onChange={(e) => setConfirmPassword(e.target.value)}
                        placeholder="Re-enter password"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"

                  </div>

                    <button
                      onClick={() => setActiveTab('dashboard')}

                      <span className="text-base">📊</span> Performance
                    </button>
                    <button
                      onClick={() => setActiveTab('test')}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition ${activeTab === 'test' ? 'bg-indigo-50 text-indigo-600 font-bold' : 'text-slate-600 hover:bg-slate-50'}`}

                    </button>

                        <span className="text-base">👑</span> Question Management
                      </button>

                      <p className="text-[11px] text-slate-400 truncate">{currentUser.email}</p>

                      onClick={() => { 
                        localStorage.removeItem('d2d_portal_user'); 
                        setCurrentUser(null); 
                        setStep('input'); 
                        setView('auth');

                      title="Sign Out"
                    >
                      🚪
                    </button>
                  </div>
                </div>
              </aside>

                      <div className="lg:col-span-2 bg-gradient-to-r from-indigo-50 via-slate-50 to-blue-50 border border-indigo-100/80 rounded-3xl p-6 sm:p-8 flex flex-col justify-between">

                          <span className="text-xs font-bold text-indigo-600 uppercase tracking-wider">Candidate Hub</span>
                          <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1 mb-2">
                            Welcome, {currentUser.name} 👋
                          </h1>
                          <p className="text-xs sm:text-sm text-slate-600 leading-relaxed">
                            Take simulated entrance tests, analyze performance indicators, and view live state rankings across all test takers.
                          </p>
                          <div className="mt-6 flex items-center gap-3">
                            <button
                              onClick={startExam}
                              className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 font-bold text-white rounded-xl text-xs shadow-md shadow-indigo-600/20 transition"
                            >
                              Launch Mock Paper →
                            </button>
                            <button
                              onClick={() => { setActiveTab('ranking'); loadLeaderboard(); }}
                              className="px-4 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 font-bold text-slate-700 rounded-xl text-xs transition"
                            >
                              Statewide Merit List
                            </button>
                          </div>
                        </div>
                      </div>

                          <p className="text-xl font-bold text-slate-900">{bestPercentage}%</p>
                          <p className="text-[11px] text-slate-400 font-medium mt-0.5">Personal Best</p>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                          <div className="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center text-sm mb-2">⏱️</div>
                          <p className="text-xl font-bold text-slate-900">{questions.length * 1.5}m</p>
                          <p className="text-[11px] text-slate-400 font-medium mt-0.5">Allocated Time</p>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                          <div className="w-8 h-8 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center text-sm mb-2">🏆</div>
                          <p className="text-xl font-bold text-slate-900">{studentScores.length}</p>
                          <p className="text-[11px] text-slate-400 font-medium mt-0.5">Total Attempts</p>
                        </div>
                      </div>

                      <div className="flex justify-between items-center mb-4">

                        <span className="text-xs font-semibold px-2.5 py-1 bg-slate-100 rounded-lg text-slate-600">

                        </span>
                      </div>

                        <div className="text-center py-10">
                          <p className="text-xs text-slate-400">No previous test attempts found.</p>
                          <button onClick={startExam} className="text-xs font-bold text-indigo-600 hover:underline mt-1">
                            Attempt your first exam →
                          </button>
                        </div>
                      ) : (

                            <thead>
                              <tr className="border-b border-slate-100 text-slate-400 uppercase tracking-wider font-semibold">

                                <th className="pb-3">Timestamp</th>
                                <th className="pb-3 text-center">Score</th>
                                <th className="pb-3 text-right pr-2">Percentage</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {studentScores.map((row, idx) => (
                                <tr key={idx} className="hover:bg-slate-50/60">
                                  <td className="py-3.5 pl-2 font-bold text-slate-800">D2D State Entrance Mock Paper</td>
                                  <td className="py-3.5 text-slate-500">{new Date(row.attempted_at).toLocaleString()}</td>
                                  <td className="py-3.5 text-center font-mono font-bold text-slate-700">
                                    {row.score} / {row.total_questions}
                                  </td>
                                  <td className="py-3.5 text-right pr-2">
                                    <span className={`px-2.5 py-1 rounded-full font-bold text-[11px] ${row.percentage >= 50 ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>
                                      {row.percentage}%
                                    </span>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>

                  </div>
                )}

                {activeTab === 'test' && (
                  <div className="space-y-6 max-w-2xl mx-auto">
                    <div className="bg-white border border-slate-200 rounded-3xl p-8 text-center shadow-sm">
                      <div className="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl mb-4 font-bold">
                        📝
                      </div>
                      <h2 className="text-2xl font-bold text-slate-900 mb-1">Statewide Mock Entrance Exam</h2>
                      <p className="text-xs text-slate-500 mb-6">Real exam timing format with live question palette and automated state rank indexing.</p>
                      
                      <div className="grid grid-cols-3 gap-3 p-4 bg-slate-50 rounded-2xl text-xs mb-6">
                        <div>
                          <p className="text-slate-400">Total Items</p>
                          <p className="font-bold text-slate-800 text-base mt-0.5">{questions.length}</p>
                        </div>
                        <div>
                          <p className="text-slate-400">Time Limit</p>
                          <p className="font-bold text-slate-800 text-base mt-0.5">{questions.length * 1.5} Mins</p>
                        </div>
                        <div>
                          <p className="text-slate-400">Scheme</p>
                          <p className="font-bold text-slate-800 text-base mt-0.5">+1.0, 0</p>
                        </div>
                      </div>

                      <button
                        onClick={startExam}
                        className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 font-bold text-white rounded-xl text-sm transition shadow-lg shadow-indigo-600/25"
                      >
                        Enter Exam Environment →
                      </button>
                    </div>
                  </div>
                )}

                {activeTab === 'ranking' && (
                  <div className="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm">
                    <div className="flex justify-between items-center mb-6">
                      <div>
                        <h2 className="text-lg font-bold text-slate-900">🏆 Statewide Entrance Merit List</h2>
                        <p className="text-xs text-slate-500">Rankings indexed by candidate personal best</p>
                      </div>
                      <button
                        onClick={loadLeaderboard}
                        className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl font-semibold border border-slate-200 transition"
                      >
                        🔄 Refresh Merit
                      </button>
                    </div>

                    {leaderboardData.length === 0 ? (
                      <p className="text-xs text-slate-400 text-center py-10">No candidate submissions indexed yet.</p>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead>
                            <tr className="border-b border-slate-200 text-slate-400 font-bold uppercase tracking-wider">
                              <th className="pb-3 pl-3">State Rank</th>
                              <th className="pb-3">Candidate</th>
                              <th className="pb-3 text-center">Best Score</th>
                              <th className="pb-3 text-right pr-3">Best Percentage</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {leaderboardData.map((row, idx) => {
                              const isMe = row.student_email === currentUser.email;
                              return (
                                <tr 
                                  key={idx} 
                                  className={`transition ${isMe ? 'bg-indigo-50/80 font-bold text-indigo-900' : 'hover:bg-slate-50 text-slate-700'}`}
                                >
                                  <td className="py-3.5 pl-3 font-extrabold text-sm">
                                    {row.rank === 1 ? '🥇 #1' : row.rank === 2 ? '🥈 #2' : row.rank === 3 ? '🥉 #3' : `#${row.rank}`}
                                  </td>
                                  <td className="py-3.5">
                                    <div className="flex items-center gap-2">
                                      <span className="font-semibold">{row.full_name || row.student_email.split('@')[0]}</span>
                                      {isMe && (
                                        <span className="text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded-full font-bold">
                                          YOU
                                        </span>
                                      )}
                                    </div>
                                  </td>
                                  <td className="py-3.5 text-center font-mono font-semibold">
                                    {row.score} / {row.total_questions}
                                  </td>
                                  <td className="py-3.5 text-right pr-3 font-mono font-bold">
                                    <span className={row.percentage >= 50 ? 'text-emerald-600' : 'text-rose-600'}>
                                      {row.percentage}%
                                    </span>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                )}

                {/* ADMIN QUESTION MANAGEMENT TAB */}
                {activeTab === 'admin' && currentUser.isAdmin && (
                  <div className="space-y-6 max-w-2xl mx-auto">
                    <div className="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 text-center shadow-sm">
                      <span className="text-xs font-bold text-amber-700 uppercase tracking-widest bg-amber-100 px-3 py-1 rounded-full border border-amber-200">
                        👑 Portal Administrator
                      </span>
                      <h2 className="text-xl font-bold text-slate-900 mt-3 mb-1">Publish Question Bank</h2>
                      <p className="text-xs text-slate-500 mb-6">Paste the raw CSV text directly below or upload your file.</p>

                      {adminMsg && (
                        <div className={`p-3 border text-xs rounded-xl mb-4 font-semibold ${adminMsg.startsWith('Success') ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-rose-50 border-rose-200 text-rose-700'}`}>
                          {adminMsg}
                        </div>
                      )}

                      {/* Direct Paste Box (Recommended for Phone) */}
                      <div className="text-left mb-4">
                        <label className="block text-xs font-bold uppercase text-slate-500 mb-1.5">Direct Paste (No File Needed)</label>
                        <textarea
                          id="rawCsvInput"
                          rows={6}
                          placeholder="Paste all questions here directly from Gemini..."
                          className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3.5 text-xs font-mono text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        ></textarea>
                        <button
                          onClick={() => {
                            const text = document.getElementById('rawCsvInput').value;
                            if (!text.trim()) {
                              setAdminMsg('Please paste your questions first.');
                              return;
                            }
                            processQuestionText(text);
                          }}
                          className="mt-2 w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-bold text-white text-xs rounded-xl shadow-md shadow-indigo-600/20 transition"
                        >
                          Load Pasted Questions →
                        </button>
                      </div>

                      <div className="relative flex py-2 items-center">
                        <div className="flex-grow border-t border-slate-200"></div>
                        <span className="flex-shrink mx-3 text-[11px] font-bold text-slate-400 uppercase">Or Select File</span>
                        <div className="flex-grow border-t border-slate-200"></div>
                      </div>

                      {/* File Input Alternative */}
                      <div className="mt-2 border-2 border-dashed border-slate-300 hover:border-indigo-500 rounded-2xl p-6 bg-slate-50 cursor-pointer relative group transition">
                        <input
                          type="file"
                          accept=".csv,text/csv,text/plain,application/vnd.ms-excel,*"
                          onChange={handleAdminCSVUpload}
                          className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                        />
                        <span className="text-3xl mb-1 block">📄</span>
                        <p className="text-xs font-bold text-slate-700">Choose .CSV File</p>
                      </div>

                      {questions.length > 0 && (
                        <p className="text-xs text-emerald-600 font-bold mt-4">
                          ✓ Active Question Pool: {questions.length} Items Loaded
                        </p>
                      )}
                    </div>
                  </div>
                )}

              </main>
            </div>
          )}

          {/* ADVANCED CBT EXAM ENGINE */}
          {view === 'quiz' && questions.length > 0 && (
            <div className="max-w-7xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col justify-center">
              
              {/* TOP CBT HEADER & TIMER */}
              <div className="flex flex-wrap gap-4 justify-between items-center bg-white border border-slate-200 p-4 rounded-2xl mb-4 shadow-sm">
                <div>
                  <span className="text-xs text-indigo-600 uppercase tracking-wider font-bold">Live Examination Session</span>
                  <h2 className="text-lg font-bold text-slate-900">
                    Question {currentIndex + 1} <span className="text-slate-400 text-xs">/ {questions.length}</span>
                  </h2>
                </div>

                {/* Real-time Summary Badges */}
                <div className="hidden sm:flex items-center gap-3 text-xs">
                  <span className="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 font-semibold border border-emerald-200">
                    ● {countAnswered} Answered
                  </span>
                  <span className="px-2.5 py-1 rounded-lg bg-purple-50 text-purple-700 font-semibold border border-purple-200">
                    ● {countReviewed} Marked Review
                  </span>
                  <span className="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 font-semibold border border-slate-200">
                    ● {countUnanswered} Unanswered
                  </span>
                </div>

                <div className="flex items-center gap-3">
                  <div className={`flex items-center gap-2 px-4 py-2 rounded-xl border font-mono font-bold text-sm ${
                    examTimeLeft <= 300 
                      ? 'bg-rose-50 border-rose-300 text-rose-600 animate-pulse' 
                      : examTimeLeft <= 600
                      ? 'bg-amber-50 border-amber-300 text-amber-600'
                      : 'bg-slate-100 border-slate-200 text-indigo-600'
                  }`}>
                    <span>⏱️</span>
                    <span>{formatTime(examTimeLeft)}</span>
                  </div>

                  <button
                    onClick={() => {
                      if (confirm("Are you sure you want to submit your test?")) {
                        handleFinishTest(false);
                      }
                    }}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-md shadow-emerald-600/20"
                  >
                    Submit Exam
                  </button>
                </div>
              </div>

              {/* MAIN TEST INTERFACE */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                {/* QUESTION & OPTIONS PANEL */}
                <div className="lg:col-span-2 bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 flex flex-col justify-between shadow-sm min-h-[480px]">
                  <div>
                    <div className="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
                      <span className="text-xs font-bold uppercase text-slate-400">Multiple Choice Question</span>
                      <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600">

                      </span>
                    </div>

                    <div className="text-base sm:text-lg font-medium text-slate-900 mb-6 leading-relaxed">
                      <MathRenderer text={questions[currentIndex].question} />
                    </div>

                    <div className="space-y-3">
                      {Object.entries(questions[currentIndex].options).map(([key, val]) => {
                        const isSelected = userAnswers[currentIndex] === key;
                        return (
                          <button
                            key={key}
                            onClick={() => setUserAnswers({ ...userAnswers, [currentIndex]: key })}
                            className={`w-full text-left p-4 rounded-2xl border transition flex items-start gap-3.5 ${
                              isSelected 
                                ? 'bg-indigo-50/80 border-indigo-600 text-indigo-950 font-medium ring-1 ring-indigo-600' 
                                : 'bg-slate-50/60 border-slate-200 text-slate-700 hover:bg-slate-100/70'
                            }`}
                          >
                            <span className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 transition ${
                              isSelected ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white border border-slate-200 text-slate-700'
                            }`}>
                              {key}
                            </span>
                            <span className="text-sm mt-1">
                              <MathRenderer text={val} />
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="pt-6 mt-6 border-t border-slate-100 flex flex-wrap gap-2.5 justify-between items-center">
                    <div className="flex gap-2">
                      <button
                        onClick={handleMarkForReviewAndNext}
                        className="px-3.5 py-2 rounded-xl text-xs font-bold bg-purple-50 text-purple-700 border border-purple-200 hover:bg-purple-100 transition"
                      >
                        {reviewedQuestions[currentIndex] ? 'Unmark Review' : 'Mark for Review & Next'}
                      </button>
                      <button
                        onClick={handleClearResponse}
                        className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition"
                      >
                        Clear Response
                      </button>
                    </div>

                    <div className="flex gap-2">
                      <button
                        onClick={() => goToQuestion(Math.max(0, currentIndex - 1))}
                        disabled={currentIndex === 0}
                        className="px-4 py-2 bg-slate-100 disabled:opacity-40 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-200 transition"
                      >
                        ← Prev
                      </button>
                      <button
                        onClick={handleSaveAndNext}
                        className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-xl text-xs font-bold text-white transition shadow-md shadow-indigo-600/20"
                      >
                        Save & Next →
                      </button>
                    </div>
                  </div>
                </div>

                {/* OFFICIAL CBT QUESTION PALETTE PANEL */}
                <div className="bg-white border border-slate-200 rounded-3xl p-6 flex flex-col justify-between shadow-sm">
                  <div>
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Question Palette</h3>
                    
                    {/* Legend */}
                    <div className="grid grid-cols-2 gap-2 text-[11px] mb-4 pb-3 border-b border-slate-100">
                      <div className="flex items-center gap-2">
                        <span className="w-3.5 h-3.5 rounded bg-emerald-500 shrink-0"></span>
                        <span className="text-slate-600">Answered</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="w-3.5 h-3.5 rounded bg-purple-600 shrink-0"></span>
                        <span className="text-slate-600">Marked Review</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="w-3.5 h-3.5 rounded bg-amber-500 shrink-0"></span>
                        <span className="text-slate-600">Not Answered</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="w-3.5 h-3.5 rounded bg-slate-200 shrink-0"></span>
                        <span className="text-slate-600">Not Visited</span>
                      </div>
                    </div>

                    {/* Palette Grid */}
                    <div className="grid grid-cols-5 gap-2 max-h-[350px] overflow-y-auto pr-1">
                      {questions.map((_, idx) => {
                        const status = getQuestionStatus(idx);
                        const isCurrent = currentIndex === idx;

                        let styleClasses = "border-slate-200 bg-slate-100 text-slate-700";
                        if (status === 'answered') styleClasses = "bg-emerald-500 border-emerald-600 text-white font-bold";
                        else if (status === 'reviewed') styleClasses = "bg-purple-600 border-purple-700 text-white font-bold";
                        else if (status === 'visited') styleClasses = "bg-amber-500 border-amber-600 text-white font-bold";

                        return (
                          <button
                            key={idx}
                            onClick={() => goToQuestion(idx)}
                            className={`h-9 rounded-xl text-xs font-bold border transition relative ${styleClasses} ${
                              isCurrent ? 'ring-2 ring-indigo-600 ring-offset-2' : ''
                            }`}
                          >
                            {idx + 1}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="mt-4 pt-4 border-t border-slate-100 text-center">
                    <p className="text-[11px] text-slate-400">Click on any question number above to navigate directly.</p>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* ADVANCED SCORECARD & BREAKDOWN */}
          {view === 'result' && lastExamSummary && (
            <div className="max-w-3xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col justify-center space-y-6">
              <div className="bg-white border border-slate-200 rounded-3xl p-8 shadow-xl shadow-slate-200/50">
                <div className="text-center mb-6">
                  <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto text-3xl mb-3 font-bold">
                    🎯
                  </div>
                  <h3 className="text-xl font-extrabold text-slate-900">Submission Confirmed</h3>
                  <p className="text-xs text-slate-500 mt-0.5">Your score has been updated in the statewide ranking view.</p>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                  <div className="bg-slate-50 border border-slate-100 p-4 rounded-2xl text-center">
                    <p className="text-xs text-slate-400">Total Score</p>
                    <p className="text-2xl font-black text-slate-900 mt-0.5">{lastExamSummary.score}/{lastExamSummary.total}</p>
                  </div>
                  <div className="bg-emerald-50/60 border border-emerald-100 p-4 rounded-2xl text-center">
                    <p className="text-xs text-emerald-600 font-medium">Correct</p>
                    <p className="text-2xl font-black text-emerald-700 mt-0.5">{lastExamSummary.correct}</p>
                  </div>
                  <div className="bg-rose-50/60 border border-rose-100 p-4 rounded-2xl text-center">
                    <p className="text-xs text-rose-600 font-medium">Incorrect</p>
                    <p className="text-2xl font-black text-rose-700 mt-0.5">{lastExamSummary.wrong}</p>
                  </div>
                  <div className="bg-amber-50/60 border border-amber-100 p-4 rounded-2xl text-center">
                    <p className="text-xs text-amber-600 font-medium">Accuracy</p>
                    <p className="text-2xl font-black text-amber-700 mt-0.5">{lastExamSummary.percentage}%</p>
                  </div>
                </div>

                <div className="flex gap-3 justify-center">
                  <button
                    onClick={() => { setView('portal'); setActiveTab('ranking'); }}
                    className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 font-bold text-white text-xs rounded-xl shadow-md shadow-indigo-600/20 transition"
                  >
                    View Live Merit Ranking →
                  </button>
                  <button
                    onClick={() => { setView('portal'); setActiveTab('dashboard'); }}
                    className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 font-bold text-slate-700 text-xs rounded-xl transition"
                  >
                    Return to Dashboard
                  </button>
                </div>
              </div>

              <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4">Detailed Answer Review</h3>
                <div className="space-y-3">
                  {questions.map((q, idx) => {
                    const picked = userAnswers[idx];
                    const isCorrect = picked === q.answer;
                    return (
                      <div key={idx} className="p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                        <div className="font-semibold text-slate-800 mb-1">
                          {idx + 1}. <MathRenderer text={q.question} />
                        </div>
                        <p className={isCorrect ? 'text-emerald-600 font-bold' : 'text-rose-600 font-medium'}>
                          Your Choice: {picked ? <span>{picked}: <MathRenderer text={q.options[picked]} /></span> : 'Unattempted'}
                        </p>
                        {!isCorrect && (
                          <p className="text-slate-500 mt-0.5 font-medium">
                            Correct Answer: <span className="text-indigo-600 font-bold">{q.answer}</span> (<MathRenderer text={q.options[q.answer]} />)
                          </p>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
