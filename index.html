<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D2D Exam Portal - AIM4RANK Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // ⚙️ AUTH CONFIGURATION KEYS
    // =========================================================================
    const ADMIN_EMAIL = 'fizavaraiya@gmail.com'.toLowerCase();
    const EMAILJS_PUBLIC_KEY  = 'ia2zoR2_x3PWxqT2Q';     
    const EMAILJS_SERVICE_ID  = 'service_xo69pzg';     
    const EMAILJS_TEMPLATE_ID = 'template_5totzc2';      
    const SUPABASE_URL = 'https://padfkukxtxvzaesvlgjx.supabase.co';     
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhZGZrdWt4dHh2emFlc3ZsZ2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NzQ4MzUsImV4cCI6MjEwNDM1MDgzNX0._LOh3gQV5MjikHDsZ2kLfFXpNASJZWIRn5w24OkTiQI';    
  
    // =========================================================================

    const cleanUrl = SUPABASE_URL.trim().replace(/\/+$/, '');
    const supabase = (cleanUrl.startsWith('http')) 
      ? window.supabase.createClient(cleanUrl, SUPABASE_ANON_KEY.trim()) 
      : null;

    function App() {
      // 🔄 PERSISTENT SESSION VIA LOCALSTORAGE
      const savedUser = JSON.parse(localStorage.getItem('aim4rank_user') || 'null');

      const [currentUser, setCurrentUser] = useState(savedUser);
      const [view, setView] = useState(savedUser ? 'portal' : 'auth'); // 'auth' | 'portal' | 'quiz' | 'result'
      const [activeTab, setActiveTab] = useState(savedUser?.isAdmin ? 'admin' : 'dashboard'); 
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'
      const [step, setStep] = useState('input'); // 'input' | 'otp' | 'set_password'
      
      const [fullName, setFullName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      const [otp, setOtp] = useState(['', '', '', '', '', '']);
      const [generatedOtp, setGeneratedOtp] = useState('');
      const [timer, setTimer] = useState(30);
      const [canResend, setCanResend] = useState(false);
      const [authMsg, setAuthMsg] = useState('');
      const [loading, setLoading] = useState(false);

      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [studentScores, setStudentScores] = useState([]);
      const [leaderboardData, setLeaderboardData] = useState([]);
      const [adminMsg, setAdminMsg] = useState('');
      const [examTimeLeft, setExamTimeLeft] = useState(0);

      const inputRefs = useRef([]);
      const userAnswersRef = useRef(userAnswers);
      userAnswersRef.current = userAnswers;

      // Automatically reload user data & question bank on page refresh
      useEffect(() => {
        if (currentUser) {
          loadStudentHistory(currentUser.email);
          loadLeaderboard();
          fetchQuestionsFromDB().then(loaded => setQuestions(loaded));
        }
      }, []);

      useEffect(() => {
        let interval = null;
        if (step === 'otp' && timer > 0) {
          interval = setInterval(() => setTimer(t => t - 1), 1000);
        } else if (timer === 0) {
          setCanResend(true);
        }
        return () => clearInterval(interval);
      }, [step, timer]);

      useEffect(() => {
        let interval = null;
        if (view === 'quiz' && examTimeLeft > 0) {
          interval = setInterval(() => {
            setExamTimeLeft(prev => {
              if (prev <= 1) {
                clearInterval(interval);
                handleFinishTest(true);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [view, examTimeLeft]);

      const formatTime = (totalSec) => {
        const hrs = Math.floor(totalSec / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        const pad = (n) => String(n).padStart(2, '0');
        return hrs > 0 ? `${pad(hrs)}:${pad(mins)}:${pad(secs)}` : `${pad(mins)}:${pad(secs)}`;
      };

      const fetchQuestionsFromDB = async () => {
        if (!supabase) return [];
        const { data, error } = await supabase.from('active_quiz').select('*').order('id', { ascending: true });
        if (error || !data) return [];
        return data.map((row, idx) => ({
          id: idx + 1,
          question: row.question,
          options: { A: row.option_a, B: row.option_b, C: row.option_c, D: row.option_d },
          answer: row.answer
        }));
      };

      const loadStudentHistory = async (studentEmail) => {
        if (!supabase) return;
        const { data, error } = await supabase
          .from('student_scores')
          .select('*')
          .eq('student_email', studentEmail)
          .order('attempted_at', { ascending: false });

        if (!error && data) setStudentScores(data);
      };

      const loadLeaderboard = async () => {
        if (!supabase) return;
        const { data, error } = await supabase
          .from('leaderboard')
          .select('*')
          .order('rank', { ascending: true })
          .limit(50);

        if (!error && data) setLeaderboardData(data);
      };

      const handlePasswordLogin = async (e) => {
        e.preventDefault();
        setAuthMsg('');

        const cleanEmail = email.trim().toLowerCase();
        if (!cleanEmail || !loginPassword) {
          setAuthMsg('Please provide both email and password.');
          return;
        }

        setLoading(true);
        try {
          const { data: user, error } = await supabase
            .from('students')
            .select('*')
            .eq('email', cleanEmail)
            .maybeSingle();

          if (error || !user) {
            setAuthMsg('No account found with this email. Please register first.');
            setLoading(false);
            return;
          }

          if (user.password !== loginPassword) {
            setAuthMsg('Incorrect password. Please try again.');
            setLoading(false);
            return;
          }

          loginSuccess(user.full_name, cleanEmail);
        } catch (err) {
          setAuthMsg('Login connection failed.');
        } finally {
          setLoading(false);
        }
      };

      const handleSendOtp = async (e) => {
        e?.preventDefault();
        setAuthMsg('');

        if (authMode === 'register' && !fullName.trim()) {
          setAuthMsg('Please enter your full name');
          return;
        }
        if (!email.trim() || !email.includes('@')) {
          setAuthMsg('Please enter a valid Gmail address');
          return;
        }

        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedOtp(code);
        setLoading(true);

        try {
          emailjs.init(EMAILJS_PUBLIC_KEY);
          await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            to_email: email.trim(),
            otp_code: code,
          });
          setStep('otp');
          setTimer(30);
          setCanResend(false);
          setOtp(['', '', '', '', '', '']);
          setTimeout(() => inputRefs.current[0]?.focus(), 150);
        } catch (err) {
          setAuthMsg('Failed to send email. Verify EmailJS keys.');
        } finally {
          setLoading(false);
        }
      };

      const handleVerifyOtp = (e) => {
        e.preventDefault();
        if (otp.join('') !== generatedOtp) {
          setAuthMsg('Invalid OTP code. Try again.');
          return;
        }
        setAuthMsg('');
        setStep('set_password');
      };

      const handleSetPassword = async (e) => {
        e.preventDefault();
        setAuthMsg('');

        if (password.length < 6) {
          setAuthMsg('Password must be at least 6 characters long.');
          return;
        }
        if (password !== confirmPassword) {
          setAuthMsg('Passwords do not match. Please verify.');
          return;
        }

        const cleanEmail = email.trim().toLowerCase();
        const studentName = fullName.trim() || cleanEmail.split('@')[0];

        setLoading(true);
        try {
          const { error } = await supabase.from('students').upsert([{
            email: cleanEmail,
            full_name: studentName,
            password: password
          }]);

          if (error) {
            setAuthMsg('Error saving password: ' + error.message);
            setLoading(false);
            return;
          }

          loginSuccess(studentName, cleanEmail);
        } catch (err) {
          setAuthMsg('Failed to establish account.');
        } finally {
          setLoading(false);
        }
      };

      const loginSuccess = async (name, studentEmail) => {
        const loggedInUser = {
          name: name,
          email: studentEmail,
          isAdmin: studentEmail === ADMIN_EMAIL
        };

        // 💾 Save session permanently to LocalStorage
        localStorage.setItem('aim4rank_user', JSON.stringify(loggedInUser));

        setCurrentUser(loggedInUser);
        await loadStudentHistory(studentEmail);
        await loadLeaderboard();

        const loadedQ = await fetchQuestionsFromDB();
        setQuestions(loadedQ);

        setView('portal');
        setActiveTab(loggedInUser.isAdmin ? 'admin' : 'dashboard');
      };

      const handleAdminCSVUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setAdminMsg('Uploading questions to Supabase...');

        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: async (results) => {
            const parsedList = [];
            const rowsToInsert = [];

            results.data.forEach((row, i) => {
              const q = row.Question || row.question;
              const a = row['Option A'] || row.A;
              const b = row['Option B'] || row.B;
              const c = row['Option C'] || row.C;
              const d = row['Option D'] || row.D;
              const ans = String(row.Answer || row.answer || '').trim();

              if (q && a && b && c && d && ans) {
                const formattedAns = ans.toUpperCase().replace('OPTION ', '').trim();
                parsedList.push({
                  id: i + 1,
                  question: q,
                  options: { A: a, B: b, C: c, D: d },
                  answer: formattedAns
                });
                rowsToInsert.push({
                  question: q,
                  option_a: String(a),
                  option_b: String(b),
                  option_c: String(c),
                  option_d: String(d),
                  answer: formattedAns
                });
              }
            });

            if (rowsToInsert.length === 0) {
              setAdminMsg('Error: Invalid CSV format.');
              return;
            }

            if (supabase) {
              await supabase.from('active_quiz').delete().neq('id', 0);
              const { error } = await supabase.from('active_quiz').insert(rowsToInsert);
              if (error) {
                setAdminMsg('Upload failed: ' + error.message);
                return;
              }
            }

            setQuestions(parsedList);
            setAdminMsg(`Success! Published ${parsedList.length} questions for ALL students.`);
          }
        });
      };

      const startExam = () => {
        if (questions.length === 0) {
          alert("No questions uploaded yet! Please upload an exam via Admin portal.");
          return;
        }
        setUserAnswers({});
        setCurrentIndex(0);
        const totalMinutes = questions.length * 1.5;
        setExamTimeLeft(Math.round(totalMinutes * 60));
        setView('quiz');
      };

      const handleFinishTest = async (isAutoSubmit = false) => {
        const answers = isAutoSubmit ? userAnswersRef.current : userAnswers;
        let score = 0;
        questions.forEach((q, idx) => {
          if (answers[idx] === q.answer) score++;
        });

        const percentage = Number(((score / questions.length) * 100).toFixed(1));

        if (supabase && currentUser) {
          try {
            await supabase.from('student_scores').insert([{
              student_email: currentUser.email,
              score: score,
              total_questions: questions.length,
              percentage: percentage
            }]);
            await loadStudentHistory(currentUser.email);
            await loadLeaderboard();
          } catch (err) {
            console.error(err);
          }
        }

        if (isAutoSubmit) {
          alert("Time's up! Exam submitted automatically.");
        }

        setView('result');
      };

      const avgPercentage = studentScores.length > 0 
        ? Math.round(studentScores.reduce((a, b) => a + Number(b.percentage), 0) / studentScores.length)
        : 0;

      return (
        <div className="min-h-screen flex flex-col">

          {/* AUTH VIEW */}
          {view === 'auth' && (
            <div className="flex-1 flex items-center justify-center p-4 bg-slate-100">
              <div className="max-w-md w-full bg-white border border-slate-200 rounded-3xl p-8 shadow-xl shadow-slate-200/50">
                <div className="text-center mb-6">
                  <div className="inline-flex items-center gap-2 mb-3">
                    <span className="w-8 h-8 rounded-lg bg-blue-600 text-white font-extrabold flex items-center justify-center text-lg shadow-md shadow-blue-500/30">A</span>
                    <span className="text-xl font-extrabold tracking-tight text-slate-900">AIM4RANK</span>
                  </div>
                  <h2 className="text-xl font-bold text-slate-800">D2D Student Portal</h2>
                  <p className="text-xs text-slate-500 mt-1">Single sign-on & password management</p>
                </div>

                {step === 'input' && (
                  <div className="flex bg-slate-100 p-1 rounded-xl mb-5">
                    <button
                      onClick={() => { setAuthMode('login'); setAuthMsg(''); }}
                      className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${authMode === 'login' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}`}
                    >
                      Sign In
                    </button>
                    <button
                      onClick={() => { setAuthMode('register'); setAuthMsg(''); }}
                      className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${authMode === 'register' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}`}
                    >
                      Register with OTP
                    </button>
                  </div>
                )}

                {authMsg && (
                  <div className="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-medium">
                    {authMsg}
                  </div>
                )}

                {/* FLOW 1: SIGN IN WITH EMAIL & PASSWORD */}
                {step === 'input' && authMode === 'login' && (
                  <form onSubmit={handlePasswordLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs uppercase font-bold text-slate-500 mb-1">Gmail Address</label>
                      <input
                        type="email"
                        required
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        placeholder="student@gmail.com"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>

                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="block text-xs uppercase font-bold text-slate-500">Password</label>
                        <button
                          type="button"
                          onClick={() => { setAuthMode('register'); handleSendOtp(); }}
                          className="text-[11px] text-blue-600 hover:underline font-semibold"
                        >
                          Forgot Password?
                        </button>
                      </div>
                      <input
                        type="password"
                        required
                        value={loginPassword}
                        onChange={(e) => setLoginPassword(e.target.value)}
                        placeholder="Enter your password"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={loading}
                      className="w-full py-3 bg-blue-600 hover:bg-blue-700 font-semibold text-white rounded-xl text-sm transition shadow-lg shadow-blue-600/30"
                    >
                      {loading ? 'Authenticating...' : 'Sign In'}
                    </button>
                  </form>
                )}

                {/* FLOW 2: REGISTER - ENTER DETAILS FOR OTP */}
                {step === 'input' && authMode === 'register' && (
                  <form onSubmit={handleSendOtp} className="space-y-4">
                    <div>
                      <label className="block text-xs uppercase font-bold text-slate-500 mb-1">Full Name</label>
                      <input
                        type="text"
                        required
                        value={fullName}
                        onChange={(e) => setFullName(e.target.value)}
                        placeholder="e.g. Varaiya Naved N"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs uppercase font-bold text-slate-500 mb-1">Gmail Address</label>
                      <input
                        type="email"
                        required
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        placeholder="student@gmail.com"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={loading}
                      className="w-full py-3 bg-blue-600 hover:bg-blue-700 font-semibold text-white rounded-xl text-sm transition shadow-lg shadow-blue-600/30"
                    >
                      {loading ? 'Sending OTP...' : 'Send Verification OTP'}
                    </button>
                  </form>
                )}

                {/* FLOW 3: ENTER OTP CODE */}
                {step === 'otp' && (
                  <div>
                    <p className="text-xs text-center text-slate-500 mb-4">Enter the 6-digit code sent to <b>{email}</b></p>
                    
                    <div className="flex justify-between gap-2 mb-6">
                      {otp.map((digit, i) => (
                        <input
                          key={i}
                          ref={(el) => (inputRefs.current[i] = el)}
                          type="text"
                          maxLength={1}
                          value={digit}
                          onChange={(e) => {
                            const val = e.target.value.slice(-1);
                            const nextOtp = [...otp];
                            nextOtp[i] = val;
                            setOtp(nextOtp);
                            if (val && i < 5) inputRefs.current[i + 1]?.focus();
                          }}
                          onKeyDown={(e) => {
                            if (e.key === 'Backspace' && !otp[i] && i > 0) inputRefs.current[i - 1]?.focus();
                          }}
                          className="w-11 h-12 text-center text-xl font-bold bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        />
                      ))}
                    </div>

                    <button
                      onClick={handleVerifyOtp}
                      className="w-full py-3 bg-blue-600 hover:bg-blue-700 font-semibold text-white rounded-xl text-sm transition shadow-lg shadow-blue-600/30"
                    >
                      Verify Code →
                    </button>

                    <div className="text-center mt-4 text-xs text-slate-400">
                      {canResend ? (
                        <button onClick={handleSendOtp} className="text-blue-600 font-bold hover:underline">
                          Resend Code
                        </button>
                      ) : (
                        <span>Resend in {timer}s</span>
                      )}
                    </div>
                  </div>
                )}

                {/* FLOW 4: CREATE PASSWORD & CONFIRM PASSWORD */}
                {step === 'set_password' && (
                  <form onSubmit={handleSetPassword} className="space-y-4">
                    <div className="text-center mb-4">
                      <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">
                        ✓ Email Verified
                      </span>
                      <p className="text-xs text-slate-500 mt-2">Create a secure password for subsequent logins.</p>
                    </div>

                    <div>
                      <label className="block text-xs uppercase font-bold text-slate-500 mb-1">Create Password</label>
                      <input
                        type="password"
                        required
                        minLength={6}
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        placeholder="At least 6 characters"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs uppercase font-bold text-slate-500 mb-1">Confirm Password</label>
                      <input
                        type="password"
                        required
                        minLength={6}
                        value={confirmPassword}
                        onChange={(e) => setConfirmPassword(e.target.value)}
                        placeholder="Re-enter password"
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={loading}
                      className="w-full py-3 bg-blue-600 hover:bg-blue-700 font-semibold text-white rounded-xl text-sm transition shadow-lg shadow-blue-600/30"
                    >
                      {loading ? 'Creating Account...' : 'Finish & Open Dashboard'}
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

          {/* MAIN AIM4RANK SAAS DASHBOARD VIEW */}
          {view === 'portal' && currentUser && (
            <div className="flex-1 flex flex-col md:flex-row min-h-screen bg-slate-50">
              
              {/* LEFT SIDEBAR NAVIGATION */}
              <aside className="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4 shrink-0">
                <div>
                  <div className="flex items-center gap-2.5 px-3 py-4 mb-4">
                    <div className="w-8 h-8 rounded-lg bg-blue-600 text-white font-black flex items-center justify-center text-lg shadow-sm">
                      A
                    </div>
                    <span className="text-lg font-extrabold tracking-tight text-slate-900">AIM4RANK</span>
                  </div>

                  <nav className="space-y-1">
                    <button
                      onClick={() => setActiveTab('dashboard')}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600 hover:bg-slate-50'}`}
                    >
                      <span className="text-base">📊</span> Dashboard
                    </button>
                    <button
                      onClick={() => setActiveTab('test')}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition ${activeTab === 'test' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600 hover:bg-slate-50'}`}
                    >
                      <span className="text-base">📝</span> Mock Test Series
                    </button>
                    <button
                      onClick={() => { setActiveTab('ranking'); loadLeaderboard(); }}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition ${activeTab === 'ranking' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600 hover:bg-slate-50'}`}
                    >
                      <span className="text-base">🏆</span> Statewide Ranking
                    </button>

                    {currentUser.isAdmin && (
                      <button
                        onClick={() => setActiveTab('admin')}
                        className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition ${activeTab === 'admin' ? 'bg-amber-50 text-amber-700 font-bold border border-amber-200' : 'text-amber-600 hover:bg-amber-50'}`}
                      >
                        <span className="text-base">👑</span> Question Bank Upload
                      </button>
                    )}

                    <div className="pt-4 mt-4 border-t border-slate-100">
                      <p className="px-3 text-[10px] font-bold uppercase text-slate-400 tracking-wider mb-2">Preparation</p>
                      <div className="space-y-1 opacity-60">
                        <div className="flex items-center gap-3 px-3 py-2 text-xs text-slate-600"><span>📚</span> Syllabus</div>
                        <div className="flex items-center gap-3 px-3 py-2 text-xs text-slate-600"><span>⚖️</span> Topic & Weightage</div>
                        <div className="flex items-center gap-3 px-3 py-2 text-xs text-slate-600"><span>📅</span> Schedule</div>
                        <div className="flex items-center gap-3 px-3 py-2 text-xs text-slate-600"><span>📖</span> Materials & Solutions</div>
                      </div>
                    </div>
                  </nav>
                </div>

                {/* USER INFO & LOGOUT */}
                <div className="pt-4 border-t border-slate-100">
                  <div className="p-3 bg-slate-50 rounded-2xl flex items-center justify-between">
                    <div className="truncate pr-2">
                      <p className="text-xs font-bold text-slate-800 truncate">{currentUser.name}</p>
                      <p className="text-[11px] text-slate-400 truncate">{currentUser.email}</p>
                    </div>
                    <button
                      onClick={() => { 
                        localStorage.removeItem('aim4rank_user'); 
                        setCurrentUser(null); 
                        setStep('input'); 
                        setView('auth'); 
                      }}
                      className="p-1.5 hover:bg-slate-200 rounded-lg text-slate-500 text-xs"
                      title="Sign Out"
                    >
                      🚪
                    </button>
                  </div>
                </div>
              </aside>

              {/* MAIN CONTENT AREA */}
              <main className="flex-1 p-6 md:p-8 overflow-y-auto max-w-7xl">
                
                {/* DASHBOARD TAB */}
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                      
                      <div className="lg:col-span-2 bg-gradient-to-r from-blue-50 via-indigo-50 to-purple-50 border border-blue-100 rounded-3xl p-6 sm:p-8 flex flex-col justify-between relative overflow-hidden">
                        <div className="relative z-10 max-w-md">
                          <span className="text-xs font-bold text-blue-600 uppercase tracking-wider">Preparation Partner</span>
                          <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1 mb-2">
                            Hi, {currentUser.name} 👋
                          </h1>
                          <p className="text-xs sm:text-sm text-slate-600 leading-relaxed">
                            What do you want to learn today with your D2D entrance exam partner? Discover questions, track performance, and achieve your target college.
                          </p>
                          <div className="mt-6 flex items-center gap-3">
                            <button
                              onClick={startExam}
                              className="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 font-bold text-white rounded-xl text-xs shadow-md shadow-blue-600/30 transition"
                            >
                              Take Live Mock Test →
                            </button>
                            <button
                              onClick={() => { setActiveTab('ranking'); loadLeaderboard(); }}
                              className="px-4 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 font-bold text-slate-700 rounded-xl text-xs transition"
                            >
                              View Ranks
                            </button>
                          </div>
                        </div>

                        <div className="absolute right-4 bottom-4 text-7xl select-none opacity-20 pointer-events-none sm:opacity-40">
                          🎓
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                          <div className="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center text-sm mb-2">📋</div>
                          <p className="text-xl font-bold text-slate-900">{questions.length}</p>
                          <p className="text-[11px] text-slate-400 font-medium mt-0.5">Total Questions</p>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                          <div className="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-sm mb-2">🎯</div>
                          <p className="text-xl font-bold text-slate-900">{avgPercentage}%</p>
                          <p className="text-[11px] text-slate-400 font-medium mt-0.5">Avg Accuracy</p>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                          <div className="w-8 h-8 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center text-sm mb-2">⏱️</div>
                          <p className="text-xl font-bold text-slate-900">{questions.length * 1.5}m</p>
                          <p className="text-[11px] text-slate-400 font-medium mt-0.5">Test Duration</p>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                          <div className="w-8 h-8 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center text-sm mb-2">🏆</div>
                          <p className="text-xl font-bold text-slate-900">{studentScores.length}</p>
                          <p className="text-[11px] text-slate-400 font-medium mt-0.5">Tests Completed</p>
                        </div>
                      </div>

                    </div>

                    <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
                      <div className="flex justify-between items-center mb-4">
                        <div>
                          <h3 className="text-sm font-bold text-slate-800">Your Exam Progress & Score History</h3>
                          <p className="text-xs text-slate-400">Previous attempts synced with Supabase</p>
                        </div>
                        <span className="text-xs font-semibold px-2.5 py-1 bg-slate-100 rounded-lg text-slate-600">
                          {studentScores.length} Attempts
                        </span>
                      </div>

                      {studentScores.length === 0 ? (
                        <div className="text-center py-10">
                          <p className="text-xs text-slate-400">No test attempts logged yet.</p>
                          <button onClick={startExam} className="text-xs font-bold text-blue-600 hover:underline mt-1">
                            Start your first exam now →
                          </button>
                        </div>
                      ) : (
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs">
                            <thead>
                              <tr className="border-b border-slate-100 text-slate-400 uppercase tracking-wider font-semibold">
                                <th className="pb-3 pl-2">Test Name</th>
                                <th className="pb-3">Attempted At</th>
                                <th className="pb-3 text-center">Marks</th>
                                <th className="pb-3 text-right pr-2">Percentage</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {studentScores.map((row, idx) => (
                                <tr key={idx} className="hover:bg-slate-50/60">
                                  <td className="py-3.5 pl-2 font-bold text-slate-800">D2D Engineering Mock Test</td>
                                  <td className="py-3.5 text-slate-500">{new Date(row.attempted_at).toLocaleString()}</td>
                                  <td className="py-3.5 text-center font-mono font-bold text-slate-700">
                                    {row.score} / {row.total_questions}
                                  </td>
                                  <td className="py-3.5 text-right pr-2">
                                    <span className={`px-2.5 py-1 rounded-full font-bold text-[11px] ${row.percentage >= 50 ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>
                                      {row.percentage}%
                                    </span>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>

                  </div>
                )}

                {/* TEST SERIES TAB */}
                {activeTab === 'test' && (
                  <div className="space-y-6 max-w-2xl mx-auto">
                    <div className="bg-white border border-slate-200 rounded-3xl p-8 text-center shadow-sm">
                      <div className="w-12 h-12 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto text-2xl mb-4 font-bold">
                        📝
                      </div>
                      <h2 className="text-2xl font-bold text-slate-900 mb-1">D2D Engineering Full Mock Test</h2>
                      <p className="text-xs text-slate-500 mb-6">Standard Lateral Entry entrance mock paper curated by instructor.</p>
                      
                      <div className="grid grid-cols-3 gap-3 p-4 bg-slate-50 rounded-2xl text-xs mb-6">
                        <div>
                          <p className="text-slate-400">Questions</p>
                          <p className="font-bold text-slate-800 text-base mt-0.5">{questions.length}</p>
                        </div>
                        <div>
                          <p className="text-slate-400">Duration</p>
                          <p className="font-bold text-slate-800 text-base mt-0.5">{questions.length * 1.5} Mins</p>
                        </div>
                        <div>
                          <p className="text-slate-400">Marking</p>
                          <p className="font-bold text-slate-800 text-base mt-0.5">+1.0, 0</p>
                        </div>
                      </div>

                      <button
                        onClick={startExam}
                        className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 font-bold text-white rounded-xl text-sm transition shadow-lg shadow-blue-600/30"
                      >
                        Launch Exam Engine Now →
                      </button>
                    </div>
                  </div>
                )}

                {/* RANKING TAB */}
                {activeTab === 'ranking' && (
                  <div className="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm">
                    <div className="flex justify-between items-center mb-6">
                      <div>
                        <h2 className="text-lg font-bold text-slate-900">🏆 Statewide Entrance Rankings</h2>
                        <p className="text-xs text-slate-500">Live merit list across all registered students</p>
                      </div>
                      <button
                        onClick={loadLeaderboard}
                        className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl font-semibold border border-slate-200 transition"
                      >
                        🔄 Refresh Merit List
                      </button>
                    </div>

                    {leaderboardData.length === 0 ? (
                      <p className="text-xs text-slate-400 text-center py-10">No test scores recorded yet.</p>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead>
                            <tr className="border-b border-slate-200 text-slate-400 font-bold uppercase tracking-wider">
                              <th className="pb-3 pl-3">Rank</th>
                              <th className="pb-3">Candidate</th>
                              <th className="pb-3 text-center">Score</th>
                              <th className="pb-3 text-right pr-3">Percentage</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {leaderboardData.map((row, idx) => {
                              const isMe = row.student_email === currentUser.email;
                              return (
                                <tr 
                                  key={idx} 
                                  className={`transition ${isMe ? 'bg-blue-50/80 font-bold text-blue-900' : 'hover:bg-slate-50 text-slate-700'}`}
                                >
                                  <td className="py-3.5 pl-3 font-extrabold text-sm">
                                    {row.rank === 1 ? '🥇 #1' : row.rank === 2 ? '🥈 #2' : row.rank === 3 ? '🥉 #3' : `#${row.rank}`}
                                  </td>
                                  <td className="py-3.5">
                                    <div className="flex items-center gap-2">
                                      <span className="font-semibold">{row.full_name || row.student_email.split('@')[0]}</span>
                                      {isMe && (
                                        <span className="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded-full font-bold">
                                          YOU
                                        </span>
                                      )}
                                    </div>
                                  </td>
                                  <td className="py-3.5 text-center font-mono font-semibold">
                                    {row.score} / {row.total_questions}
                                  </td>
                                  <td className="py-3.5 text-right pr-3 font-mono font-bold">
                                    <span className={row.percentage >= 50 ? 'text-emerald-600' : 'text-rose-600'}>
                                      {row.percentage}%
                                    </span>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                )}

                {/* ADMIN UPLOAD TAB */}
                {activeTab === 'admin' && currentUser.isAdmin && (
                  <div className="space-y-6 max-w-2xl mx-auto">
                    <div className="bg-white border border-slate-200 rounded-3xl p-8 text-center shadow-sm">
                      <span className="text-xs font-bold text-amber-700 uppercase tracking-widest bg-amber-100 px-3 py-1 rounded-full border border-amber-200">
                        👑 Instructor Administration
                      </span>
                      <h2 className="text-xl font-bold text-slate-900 mt-3 mb-1">Upload New Question Bank</h2>
                      <p className="text-xs text-slate-500 mb-6">Drop your CSV to sync questions directly with Supabase for every student.</p>

                      {adminMsg && (
                        <div className="p-3 bg-blue-50 border border-blue-200 text-blue-700 text-xs rounded-xl mb-4 font-semibold">
                          {adminMsg}
                        </div>
                      )}

                      <div className="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-2xl p-8 bg-slate-50 cursor-pointer relative group transition">
                        <input
                          type="file"
                          accept=".csv"
                          onChange={handleAdminCSVUpload}
                          className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                        />
                        <span className="text-4xl mb-2 block">📄</span>
                        <p className="text-sm font-bold text-slate-700">Click or Drag your .CSV file here</p>
                        <p className="text-xs text-slate-400 mt-1">Headers: Question, Option A, Option B, Option C, Option D, Answer</p>
                      </div>

                      {questions.length > 0 && (
                        <p className="text-xs text-emerald-600 font-bold mt-4">
                          ✓ Currently Loaded: {questions.length} Questions ({questions.length * 1.5} Mins)
                        </p>
                      )}
                    </div>
                  </div>
                )}

              </main>
            </div>
          )}

          {/* EXAM ENGINE */}
          {view === 'quiz' && questions.length > 0 && (
            <div className="max-w-4xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col justify-center">
              <div className="flex justify-between items-center bg-white border border-slate-200 p-4 rounded-2xl mb-6 shadow-sm">
                <div>
                  <span className="text-xs text-blue-600 uppercase tracking-wider font-bold">D2D Mock Exam</span>
                  <h2 className="text-xl font-bold text-slate-900">Question {currentIndex + 1} <span className="text-slate-400 text-sm">/ {questions.length}</span></h2>
                </div>

                <div className={`flex items-center gap-2 px-4 py-2 rounded-xl border font-mono font-bold text-sm ${
                  examTimeLeft <= 300 
                    ? 'bg-rose-50 border-rose-300 text-rose-600 animate-pulse' 
                    : examTimeLeft <= 600
                    ? 'bg-amber-50 border-amber-300 text-amber-600'
                    : 'bg-slate-100 border-slate-200 text-blue-600'
                }`}>
                  <span>⏱️</span>
                  <span>{formatTime(examTimeLeft)}</span>
                </div>

                <button
                  onClick={() => handleFinishTest(false)}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-md shadow-emerald-600/20"
                >
                  Submit & Finish
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="md:col-span-2 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                  <p className="text-base font-semibold text-slate-900 mb-6 leading-relaxed">
                    {questions[currentIndex].question}
                  </p>

                  <div className="space-y-3">
                    {Object.entries(questions[currentIndex].options).map(([key, val]) => {
                      const isSelected = userAnswers[currentIndex] === key;
                      return (
                        <button
                          key={key}
                          onClick={() => setUserAnswers({ ...userAnswers, [currentIndex]: key })}
                          className={`w-full text-left p-3.5 rounded-xl border transition flex items-start gap-3 ${isSelected ? 'bg-blue-50 border-blue-500 text-blue-900 font-medium' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}`}
                        >
                          <span className={`w-6 h-6 rounded-md flex items-center justify-center text-xs font-bold shrink-0 ${isSelected ? 'bg-blue-600 text-white' : 'bg-white border border-slate-200 text-slate-700'}`}>
                            {key}
                          </span>
                          <span className="text-sm mt-0.5">{val}</span>
                        </button>
                      );
                    })}
                  </div>

                  <div className="flex justify-between items-center mt-6 pt-4 border-t border-slate-100">
                    <button
                      onClick={() => setCurrentIndex(p => Math.max(0, p - 1))}
                      disabled={currentIndex === 0}
                      className="px-4 py-2 bg-slate-100 disabled:opacity-30 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-200"
                    >
                      ← Previous
                    </button>
                    <button
                      onClick={() => setCurrentIndex(p => Math.min(questions.length - 1, p + 1))}
                      disabled={currentIndex === questions.length - 1}
                      className="px-4 py-2 bg-blue-600 disabled:opacity-30 rounded-xl text-xs font-bold text-white hover:bg-blue-700"
                    >
                      Next →
                    </button>
                  </div>
                </div>

                <div className="bg-white border border-slate-200 rounded-2xl p-4 h-fit max-h-[500px] flex flex-col shadow-sm">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Question Sheet</h4>
                  <div className="grid grid-cols-5 gap-1.5 overflow-y-auto pr-1">
                    {questions.map((_, idx) => (
                      <button
                        key={idx}
                        onClick={() => setCurrentIndex(idx)}
                        className={`h-8 rounded-lg text-xs font-bold border transition ${currentIndex === idx ? 'border-blue-600 bg-blue-600 text-white' : userAnswers[idx] ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-slate-200 bg-slate-50 text-slate-600'}`}
                      >
                        {idx + 1}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* RESULTS CARD */}
          {view === 'result' && (
            <div className="max-w-2xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col justify-center space-y-6">
              <div className="bg-white border border-slate-200 rounded-3xl p-8 text-center shadow-xl shadow-slate-200/50">
                <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto text-3xl mb-3 font-bold">
                  🎯
                </div>
                <div className="text-4xl font-extrabold text-slate-900 mb-1">
                  {Object.keys(userAnswers).filter(i => userAnswers[i] === questions[i].answer).length} / {questions.length}
                </div>
                <h3 className="text-lg font-bold text-slate-800 mb-2">Test Submitted Successfully!</h3>
                <p className="text-xs text-slate-500 mb-6">Your score has been permanently saved to Supabase and calculated into the Statewide Rankings.</p>
                
                <button
                  onClick={() => { setView('portal'); setActiveTab('ranking'); }}
                  className="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 font-bold text-white text-xs rounded-xl shadow-md shadow-blue-600/30 transition"
                >
                  View Your Live State Rank →
                </button>
              </div>

              <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4">Answer Key Review</h3>
                <div className="space-y-3">
                  {questions.map((q, idx) => {
                    const picked = userAnswers[idx];
                    const isCorrect = picked === q.answer;
                    return (
                      <div key={idx} className="p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                        <p className="font-semibold text-slate-800 mb-1">{idx + 1}. {q.question}</p>
                        <p className={isCorrect ? 'text-emerald-600 font-bold' : 'text-rose-600 font-medium'}>
                          Your Choice: {picked ? `${picked}: ${q.options[picked]}` : 'Unanswered'}
                        </p>
                        {!isCorrect && (
                          <p className="text-slate-500 mt-0.5 font-medium">
                            Correct: <span className="text-blue-600 font-bold">{q.answer}</span> ({q.options[q.answer]})
                          </p>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
